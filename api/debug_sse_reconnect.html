<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SSE Last-Event-ID 重连测试工具</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #f5f5f5;
            padding: 20px;
            line-height: 1.6;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            padding: 30px;
        }

        h1 {
            color: #333;
            margin-bottom: 30px;
            border-bottom: 2px solid #2196F3;
            padding-bottom: 10px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 500;
        }

        input[type="text"],
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
            font-family: 'Monaco', 'Menlo', 'Ubuntu Mono', monospace;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus,
        textarea:focus {
            outline: none;
            border-color: #2196F3;
        }

        textarea {
            min-height: 150px;
            resize: vertical;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 20px;
        }

        .checkbox-group input[type="checkbox"] {
            width: auto;
            cursor: pointer;
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        button {
            padding: 12px 24px;
            border: none;
            border-radius: 4px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background: #2196F3;
            color: white;
        }

        .btn-primary:hover:not(:disabled) {
            background: #1976D2;
        }

        .btn-success {
            background: #4CAF50;
            color: white;
        }

        .btn-success:hover:not(:disabled) {
            background: #45a049;
        }

        .btn-danger {
            background: #f44336;
            color: white;
        }

        .btn-danger:hover:not(:disabled) {
            background: #da190b;
        }

        .btn-warning {
            background: #ff9800;
            color: white;
        }

        .btn-warning:hover:not(:disabled) {
            background: #f57c00;
        }

        .btn-clear {
            background: #9e9e9e;
            color: white;
        }

        .btn-clear:hover:not(:disabled) {
            background: #757575;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .status {
            padding: 12px;
            border-radius: 4px;
            margin-bottom: 20px;
            font-weight: 500;
        }

        .status.connecting {
            background: #fff3cd;
            color: #856404;
            border: 1px solid #ffeaa7;
        }

        .status.connected {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .status.reconnecting {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }

        .status.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .status.stopped {
            background: #e2e3e5;
            color: #383d41;
            border: 1px solid #d6d8db;
        }

        .info-panel {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .info-card {
            background: #f8f9fa;
            border: 1px solid #dee2e6;
            border-radius: 4px;
            padding: 15px;
        }

        .info-card h3 {
            font-size: 14px;
            color: #666;
            margin-bottom: 8px;
            font-weight: 500;
        }

        .info-card .value {
            font-size: 16px;
            color: #333;
            font-weight: 600;
            font-family: 'Monaco', 'Menlo', 'Ubuntu Mono', monospace;
            word-break: break-all;
        }

        .info-card .value.empty {
            color: #999;
            font-style: italic;
        }

        .response-section {
            margin-top: 30px;
        }

        .response-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .response-header h2 {
            color: #333;
            font-size: 18px;
        }

        #responseOutput {
            background: #1e1e1e;
            color: #d4d4d4;
            padding: 20px;
            border-radius: 4px;
            font-family: 'Monaco', 'Menlo', 'Ubuntu Mono', monospace;
            font-size: 13px;
            line-height: 1.5;
            max-height: 600px;
            overflow-y: auto;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .event-item {
            margin-bottom: 10px;
            padding: 8px;
            background: #2d2d2d;
            border-left: 3px solid #4CAF50;
            border-radius: 2px;
        }

        .event-item.error {
            border-left-color: #f44336;
        }

        .event-item.info {
            border-left-color: #2196F3;
        }

        .event-item.reconnect {
            border-left-color: #ff9800;
        }

        .timestamp {
            color: #888;
            font-size: 11px;
            margin-right: 10px;
        }

        .help-text {
            color: #666;
            font-size: 12px;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔄 SSE Last-Event-ID 重连测试工具</h1>

        <div class="form-group">
            <label for="apiUrl">API 请求链接:</label>
            <input type="text" id="apiUrl" placeholder="例如: http://localhost:5001/v1/workflows/run" value="http://localhost:5001/v1/workflows/run">
            <div class="help-text">
                支持完整 URL，包括协议、主机、端口和路径
            </div>
        </div>

        <div class="form-group">
            <label for="authToken">Authorization Token:</label>
            <input type="text" id="authToken" placeholder="例如: app-ZalgXHULl6MRVHFSvTzg5U4H" value="app-ZalgXHULl6MRVHFSvTzg5U4H">
            <div class="help-text">
                用于身份验证的 Bearer Token（格式: app-xxx 或 Bearer token）
            </div>
        </div>

        <div class="form-group">
            <label for="requestBody">请求参数 (JSON):</label>
            <textarea id="requestBody" placeholder='例如: {"inputs": {"query": "你好"}, "response_mode": "streaming"}'>{
  "inputs": {
    "query": "你好"
  },
  "user": "abc",
  "response_mode": "streaming"
}</textarea>
            <div class="help-text">
                请输入有效的 JSON 格式数据
            </div>
        </div>

        <div class="checkbox-group">
            <input type="checkbox" id="autoReconnect" checked>
            <label for="autoReconnect">启用自动重连（连接断开时自动使用 Last-Event-ID 重连）</label>
        </div>

        <div class="checkbox-group">
            <input type="checkbox" id="simulateDisconnect">
            <label for="simulateDisconnect">模拟断开连接（5秒后自动断开，用于测试重连）</label>
        </div>

        <div class="button-group">
            <button id="startBtn" class="btn-primary" onclick="startRequest()">🚀 发起请求</button>
            <button id="disconnectBtn" class="btn-warning" onclick="disconnectRequest()" disabled>🔌 断开连接</button>
            <button id="reconnectBtn" class="btn-success" onclick="reconnectRequest()" disabled>🔄 手动重连</button>
            <button id="abortBtn" class="btn-danger" onclick="abortRequest()" disabled>⛔ 中止请求</button>
            <button id="clearBtn" class="btn-clear" onclick="clearOutput()">🗑️ 清空输出</button>
        </div>

        <div id="status" class="status" style="display: none;"></div>

        <div class="info-panel">
            <div class="info-card">
                <h3>当前 Last-Event-ID</h3>
                <div id="lastEventId" class="value empty">无</div>
            </div>
            <div class="info-card">
                <h3>重连次数</h3>
                <div id="reconnectCount" class="value">0</div>
            </div>
            <div class="info-card">
                <h3>接收事件数</h3>
                <div id="eventCount" class="value">0</div>
            </div>
            <div class="info-card">
                <h3>连接状态</h3>
                <div id="connectionState" class="value">未连接</div>
            </div>
        </div>

        <div class="response-section">
            <div class="response-header">
                <h2>📋 响应输出</h2>
            </div>
            <div id="responseOutput"></div>
        </div>
    </div>

    <script>
        let abortController = null;
        let isRequesting = false;
        let lastEventId = null;
        let reconnectCount = 0;
        let eventCount = 0;
        let reader = null;
        let simulateDisconnectTimer = null;
        let reconnectTimer = null;
        let isReconnecting = false;

        function updateStatus(message, type = 'info') {
            const statusEl = document.getElementById('status');
            statusEl.textContent = message;
            statusEl.className = `status ${type}`;
            statusEl.style.display = 'block';
        }

        function updateInfoPanel() {
            document.getElementById('lastEventId').textContent = lastEventId || '无';
            document.getElementById('lastEventId').className = lastEventId ? 'value' : 'value empty';
            document.getElementById('reconnectCount').textContent = reconnectCount;
            document.getElementById('eventCount').textContent = eventCount;
        }

        function updateConnectionState(state) {
            document.getElementById('connectionState').textContent = state;
        }

        function addResponse(message, type = 'info') {
            const output = document.getElementById('responseOutput');
            const timestamp = new Date().toLocaleTimeString('zh-CN', { hour12: false, hour: '2-digit', minute: '2-digit', second: '2-digit', fractionalSecondDigits: 3 });
            const eventItem = document.createElement('div');
            eventItem.className = `event-item ${type}`;
            eventItem.innerHTML = `<span class="timestamp">[${timestamp}]</span>${message}`;
            output.appendChild(eventItem);
            output.scrollTop = output.scrollHeight;
        }

        function clearOutput() {
            document.getElementById('responseOutput').innerHTML = '';
            document.getElementById('status').style.display = 'none';
        }

        function resetCounters() {
            reconnectCount = 0;
            eventCount = 0;
            lastEventId = null;
            updateInfoPanel();
        }

        async function startRequest(isReconnect = false) {
            if (isRequesting && !isReconnect) {
                alert('请求正在进行中，请先中止当前请求');
                return;
            }

            const apiUrl = document.getElementById('apiUrl').value.trim();
            const authToken = document.getElementById('authToken').value.trim();
            const requestBodyText = document.getElementById('requestBody').value.trim();

            if (!apiUrl) {
                alert('请输入 API 请求链接');
                return;
            }

            if (!authToken) {
                alert('请输入 Authorization Token');
                return;
            }

            if (!requestBodyText) {
                alert('请输入请求参数');
                return;
            }

            let requestBody;
            try {
                requestBody = JSON.parse(requestBodyText);
            } catch (e) {
                alert('请求参数不是有效的 JSON 格式: ' + e.message);
                return;
            }

            // 创建新的 AbortController
            abortController = new AbortController();
            isRequesting = true;
            isReconnecting = isReconnect;

            // 更新 UI 状态
            if (!isReconnect) {
                document.getElementById('startBtn').disabled = true;
                resetCounters();
            }
            document.getElementById('disconnectBtn').disabled = false;
            document.getElementById('reconnectBtn').disabled = true;
            document.getElementById('abortBtn').disabled = false;

            if (isReconnect) {
                reconnectCount++;
                updateStatus(`正在重连... (第 ${reconnectCount} 次)`, 'reconnecting');
                addResponse(`🔄 开始重连，使用 Last-Event-ID: ${lastEventId}`, 'reconnect');
            } else {
                clearOutput();
                updateStatus('正在连接...', 'connecting');
                addResponse('开始发起 SSE 请求...', 'info');
            }

            addResponse(`URL: ${apiUrl}`, 'info');
            addResponse(`Authorization: Bearer ${authToken}`, 'info');
            if (lastEventId) {
                addResponse(`Last-Event-ID: ${lastEventId}`, 'reconnect');
            }
            addResponse(`请求体: ${JSON.stringify(requestBody, null, 2)}`, 'info');

            // 构建 Authorization header
            const authHeader = authToken.startsWith('Bearer ') ? authToken : `Bearer ${authToken}`;

            // 构建 headers
            const headers = {
                'Content-Type': 'application/json',
                'Accept': 'text/event-stream',
                'Authorization': authHeader,
            };

            // 如果重连且有 last-event-id，添加 Last-Event-ID header
            if (isReconnect && lastEventId) {
                headers['Last-Event-ID'] = lastEventId;
            }

            try {
                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: headers,
                    body: JSON.stringify(requestBody),
                    signal: abortController.signal,
                });

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }

                if (!response.body) {
                    throw new Error('响应体为空');
                }

                updateStatus(isReconnect ? `已重连，正在接收数据... (第 ${reconnectCount} 次)` : '已连接，正在接收数据...', 'connected');
                updateConnectionState('已连接');
                addResponse(isReconnect ? '✅ 重连成功，继续接收 SSE 事件...' : '✅ 连接成功，开始接收 SSE 事件...', 'info');

                reader = response.body.getReader();
                const decoder = new TextDecoder();
                let buffer = '';

                // 如果启用了模拟断开，设置定时器
                if (document.getElementById('simulateDisconnect').checked && !isReconnect) {
                    simulateDisconnectTimer = setTimeout(() => {
                        addResponse('⏰ 模拟断开连接（5秒定时器触发）', 'error');
                        disconnectRequest(true);
                    }, 5000);
                }

                while (true) {
                    const { done, value } = await reader.read();

                    if (done) {
                        addResponse('✅ 流已结束', 'info');
                        updateStatus('请求完成', 'connected');
                        updateConnectionState('已断开');
                        break;
                    }

                    buffer += decoder.decode(value, { stream: true });
                    const lines = buffer.split('\n');
                    buffer = lines.pop() || '';

                    let currentEventId = null;
                    let currentEventType = null;
                    let currentData = null;

                    for (const line of lines) {
                        if (line.trim() === '') {
                            // 空行表示事件结束，处理完整事件
                            if (currentEventId) {
                                lastEventId = currentEventId;
                                updateInfoPanel();
                            }
                            if (currentData) {
                                eventCount++;
                                updateInfoPanel();
                                try {
                                    const jsonData = JSON.parse(currentData);
                                    addResponse(`📦 事件数据: ${JSON.stringify(jsonData, null, 2)}`, 'info');
                                    
                                    // 检查是否是完成事件
                                    if (jsonData.event === 'workflow_finished' || 
                                        jsonData.event === 'workflow_failed' ||
                                        jsonData.event === 'workflow_stopped') {
                                        updateStatus('工作流执行完成', 'connected');
                                        updateConnectionState('已完成');
                                    }
                                } catch (e) {
                                    addResponse(`📝 原始数据: ${currentData}`, 'info');
                                }
                            }
                            currentEventId = null;
                            currentEventType = null;
                            currentData = null;
                            continue;
                        }

                        if (line.startsWith('id: ')) {
                            currentEventId = line.substring(4).trim();
                            addResponse(`🆔 事件 ID: ${currentEventId}`, 'info');
                        } else if (line.startsWith('event: ')) {
                            currentEventType = line.substring(7).trim();
                            addResponse(`🎯 事件类型: ${currentEventType}`, 'info');
                        } else if (line.startsWith('data: ')) {
                            const data = line.substring(6);
                            if (currentData === null) {
                                currentData = data;
                            } else {
                                currentData += '\n' + data;
                            }
                        } else {
                            addResponse(`📄 ${line}`, 'info');
                        }
                    }
                }
            } catch (error) {
                if (error.name === 'AbortError') {
                    addResponse('⛔ 请求已被中止', 'error');
                    updateStatus('请求已中止', 'stopped');
                    updateConnectionState('已中止');
                } else {
                    addResponse(`❌ 错误: ${error.message}`, 'error');
                    updateStatus(`错误: ${error.message}`, 'error');
                    updateConnectionState('连接错误');
                    console.error('Request error:', error);

                    // 如果启用自动重连且不是手动中止，尝试重连
                    if (document.getElementById('autoReconnect').checked && lastEventId && !abortController.signal.aborted) {
                        addResponse('🔄 检测到连接错误，将在 2 秒后自动重连...', 'reconnect');
                        reconnectTimer = setTimeout(() => {
                            startRequest(true);
                        }, 2000);
                        return;
                    }
                }
            } finally {
                isRequesting = false;
                isReconnecting = false;
                reader = null;
                if (simulateDisconnectTimer) {
                    clearTimeout(simulateDisconnectTimer);
                    simulateDisconnectTimer = null;
                }
                if (reconnectTimer) {
                    clearTimeout(reconnectTimer);
                    reconnectTimer = null;
                }
                document.getElementById('startBtn').disabled = false;
                document.getElementById('disconnectBtn').disabled = true;
                document.getElementById('reconnectBtn').disabled = !lastEventId;
                document.getElementById('abortBtn').disabled = true;
            }
        }

        function disconnectRequest(silent = false) {
            if (abortController && reader) {
                abortController.abort();
                if (reader) {
                    reader.cancel();
                }
                if (!silent) {
                    addResponse('🔌 用户手动断开连接', 'error');
                    updateStatus('连接已断开', 'stopped');
                }
                updateConnectionState('已断开');

                // 如果启用自动重连且有 last-event-id，自动重连
                if (document.getElementById('autoReconnect').checked && lastEventId) {
                    addResponse('🔄 检测到连接断开，将在 2 秒后自动重连...', 'reconnect');
                    reconnectTimer = setTimeout(() => {
                        startRequest(true);
                    }, 2000);
                } else {
                    document.getElementById('reconnectBtn').disabled = !lastEventId;
                }
            }
        }

        function reconnectRequest() {
            if (!lastEventId) {
                alert('没有可用的 Last-Event-ID，无法重连');
                return;
            }
            disconnectRequest(true);
            setTimeout(() => {
                startRequest(true);
            }, 500);
        }

        function abortRequest() {
            if (abortController) {
                abortController.abort();
                if (reader) {
                    reader.cancel();
                }
                addResponse('⛔ 用户手动中止请求', 'error');
                updateStatus('请求已中止', 'stopped');
                updateConnectionState('已中止');
                resetCounters();
            }
        }

        // 页面卸载时清理
        window.addEventListener('beforeunload', () => {
            if (abortController) {
                abortController.abort();
            }
            if (simulateDisconnectTimer) {
                clearTimeout(simulateDisconnectTimer);
            }
            if (reconnectTimer) {
                clearTimeout(reconnectTimer);
            }
        });

        // 支持 Enter 键快速发起请求（Ctrl/Cmd + Enter）
        document.getElementById('requestBody').addEventListener('keydown', (e) => {
            if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
                e.preventDefault();
                startRequest();
            }
        });
    </script>
</body>
</html>
